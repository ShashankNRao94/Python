name: Deploy de project 1

on:
  push:
    branches:
      - dev
      - main
      - de_project_1
  workflow_dispatch:

env:
  # Standard environment variables for your custom Python scripts (deploy_snowpark_app.py, create_task.py)
  SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT_DEV }}
  SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER_DEV }}
  SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD_DEV }}
  SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE_DEV }}
  SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE_DEV }}
  SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE_DEV }}
  SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA_DEV }}

  # Snowflake CLI connection profile variables (Maps directly to connection name 'dev')
  SNOWFLAKE_DEFAULT_CONNECTION_NAME: "dev"
  SNOWFLAKE_CONNECTIONS_DEV_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT_DEV }}
  SNOWFLAKE_CONNECTIONS_DEV_USER: ${{ secrets.SNOWFLAKE_USER_DEV }}
  SNOWFLAKE_CONNECTIONS_DEV_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD_DEV }}
  SNOWFLAKE_CONNECTIONS_DEV_ROLE: ${{ secrets.SNOWFLAKE_ROLE_DEV }}
  SNOWFLAKE_CONNECTIONS_DEV_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE_DEV }}
  SNOWFLAKE_CONNECTIONS_DEV_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE_DEV }}
  SNOWFLAKE_CONNECTIONS_DEV_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA_DEV }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Checks out the current repository where the workflow is running
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies & Snowflake CLI
        run: |
          python -m pip install --upgrade pip
          if [ -f DE_PROJECT_1/requirements.txt ]; then pip install -r DE_PROJECT_1/requirements.txt; fi
          pip install snowflake-cli

      - name: Copy SQL file to Stage
        working-directory: DE_PROJECT_1/app
        run: snow stage copy load_to_emp_tgt.sql @dev_deployment/de_project_1/ --connection dev --overwrite

      - name: Deploy Snowpark apps
        working-directory: DE_PROJECT_1
        run: python deploy_snowpark_app.py $GITHUB_WORKSPACE/DE_PROJECT_1

      - name: Deploy Snowpark tasks
        working-directory: DE_PROJECT_1/app
        run: python create_task.py